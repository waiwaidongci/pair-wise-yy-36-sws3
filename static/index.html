<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业排污许可与超标处置</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto;white-space:pre-wrap}button{padding:.45rem .9rem}input,select{padding:.35rem;margin:.15rem .25rem .15rem 0}fieldset{margin:.8rem 0;border:1px solid #d5dde5;border-radius:6px}legend{padding:0 .4rem}</style></head><body><h1>企业排污许可与超标处置</h1><p>汇总监测和工况，判断排放超标并跟踪复测、整改、执法与复查。</p><p>复查阶段由合规员登记现场检查（检查日期、承办人、现场结论）；暂缓须写明复检日期与原因，同一事件仅保留一笔待办检查；发现新的超标退回整改并按最新浓度重算优先级与期限。主任须在最近检查完成且问题全部关闭后归档，否则详情接口以close_blockers列出阻塞项。</p><div><label>Actor <input id="actor" value="demo"></label><label>Role <select id="role"><option>viewer</option><option>operator</option><option>compliance_officer</option><option>director</option></select></label><label>事件ID <input id="itemId" type="number" min="1" style="width:6rem"></label></div>
<fieldset><legend>查询</legend><button onclick="loadItems()">刷新列表</button> <button onclick="loadDetail()">加载详情与阻塞项</button> <button onclick="loadInspections()">检查记录</button></fieldset>
<fieldset><legend>登记检查（合规员）</legend><input id="inspDate" type="date"> 检查日期 <input id="handler" placeholder="承办人"> <button onclick="registerInspection()">登记</button></fieldset>
<fieldset><legend>现场结论（合规员）</legend><input id="doneInspId" type="number" min="1" placeholder="检查单ID" style="width:7rem"> <select id="conclusion"><option value="passed">通过</option><option value="exceedance_found">发现新超标</option></select> <input id="newQuantity" type="number" step="any" placeholder="最新浓度(超标必填)" style="width:10rem"> <button onclick="completeInspection()">完成检查</button></fieldset>
<fieldset><legend>暂缓（合规员）</legend><input id="deferInspId" type="number" min="1" placeholder="检查单ID" style="width:7rem"> <input id="recheckDate" type="date"> 复检日期 <input id="deferReason" placeholder="暂缓原因"> <button onclick="deferInspection()">暂缓</button></fieldset>
<fieldset><legend>归档（主任）</legend><button onclick="closeItem()">归档结案</button> 需最近检查完成且整改项全部关闭，否则阻塞项见详情。</fieldset>
<pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>
const H=()=>({'Content-Type':'application/json','X-Actor':document.getElementById('actor').value,'X-Role':document.getElementById('role').value});
const itemId=()=>document.getElementById('itemId').value;
const show=j=>document.getElementById('out').textContent=JSON.stringify(j,null,2);
async function call(method,url,body){const r=await fetch(url,{method,headers:H(),body:body?JSON.stringify(body):undefined});const j=await r.json();show(j);return j}
async function loadItems(){show(await(await fetch('/api/items',{headers:H()})).json())}
async function loadDetail(){await call('GET','/api/items/'+itemId())}
async function loadInspections(){show(await(await fetch('/api/items/'+itemId()+'/inspections',{headers:H()})).json())}
async function registerInspection(){await call('POST','/api/items/'+itemId()+'/inspections',{inspection_date:document.getElementById('inspDate').value,handler:document.getElementById('handler').value})}
async function completeInspection(){const b={conclusion:document.getElementById('conclusion').value};const q=document.getElementById('newQuantity').value;if(q)b.new_quantity=Number(q);await call('POST','/api/items/'+itemId()+'/inspections/'+document.getElementById('doneInspId').value+'/complete',b)}
async function deferInspection(){await call('POST','/api/items/'+itemId()+'/inspections/'+document.getElementById('deferInspId').value+'/defer',{recheck_date:document.getElementById('recheckDate').value,reason:document.getElementById('deferReason').value})}
async function closeItem(){const d=await call('GET','/api/items/'+itemId());if(!d||d.error)return;await call('POST','/api/items/'+itemId()+'/transition',{target:'closed',expected_version:d.version})}
</script></body></html>
